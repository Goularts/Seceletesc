name: ci

# Revisão independente do desenvolvimento (qualidade.md, seção 5).
# Endurecido conforme plano técnico, seção 4.10: permissões mínimas, actions fixadas por SHA,
# imagens por digest, pacotes NuGet travados por lock file, só pull_request (nunca
# pull_request_target), nenhum segredo usado.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-testes:
    name: build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (lock files)
        run: dotnet restore --locked-mode

      - name: Build (avisos são erros)
        run: dotnet build --no-restore --configuration Release

      # Inclui: testes de integração com PostgreSQL real (Testcontainers usa o Docker do runner),
      # testes de arquitetura e a contagem de testes por regra (cobertura-obrigatoria.txt).
      - name: Testes
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  cobertura-nao-diminui:
    name: proteção das regras não diminui
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compara cobertura-obrigatoria.txt com a branch de destino
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/${BASE_REF}:docs/desenvolvimento/cobertura-obrigatoria.txt" 2>/dev/null; then
            git show "origin/${BASE_REF}:docs/desenvolvimento/cobertura-obrigatoria.txt" > /tmp/cobertura-base.txt
            python3 .github/scripts/cobertura_nao_diminui.py /tmp/cobertura-base.txt docs/desenvolvimento/cobertura-obrigatoria.txt
          else
            echo "Branch de destino ainda não tem cobertura-obrigatoria.txt; nada a comparar."
          fi

  segredos:
    name: varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (histórico completo)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose
